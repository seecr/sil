[build-system]
requires = ["setuptools", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "sil"
authors = [
    {name = "Thijs Janssen", email = "thijs@seecr.nl"},
    {name = "Johan Jonkers", email = "johan@seecr.nl"},
]
description = "Seecr Index Lib adds indexing capabilities to webbased apps"
readme = "README.md"
requires-python = ">=3.10"
keywords = ["swl"]
license = {file = "LICENSE"}
classifiers = [
    "License :: OSI Approved :: GNU General Public License v2 (GPLv2)",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "JCC >= 3.15, < 4",
    "lucene >= 10.0.0, < 11",
    "pytest >= 9.0.3, < 10",
    "pytest-asyncio >= 1.3.0, < 2",
    "pytest-xdist >= 3.8.0, < 4",
    "python-multipart >= 0.0.26, < 1",
]
dynamic = ["version"]

[tool.setuptools_scm]
version_file = "sil/_version.py"

[tool.setuptools.packages.find]
where = ["."]

[tool.setuptools]
include-package-data = true

[tool.isort]
profile = "black"
